services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: civitas
      POSTGRES_USER: civitas
      POSTGRES_PASSWORD: civitas
    ports:
      - "5432:5432"
    volumes:
      - civitas_postgres_data:/var/lib/postgresql/data
volumes:
  civitas_postgres_data:
